# Local development stack for `supabase start`. Hosted projects are configured in the
# Supabase dashboard; keep the auth URLs below in sync with Authentication → URL Configuration.
project_id = "strata"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local mail catcher (Mailpit). Confirmation and reset emails appear at http://127.0.0.1:54324.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Must be at least the largest bucket limit (generated media: 500 MiB).
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/**", "strata://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
