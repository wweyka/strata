[project]
name = "strata-ai"
version = "0.1.0"
description = "Strata AI service: REST API and background workers for ingestion and generation."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.36",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "psycopg[binary,pool]>=3.2",
]

[project.scripts]
strata-api = "strata_ai.serve:main"
strata-worker = "strata_ai.worker.main:run"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata_ai"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
